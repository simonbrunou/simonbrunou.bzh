<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Page not found, Simon Brunou</title>
        <meta name="description" content="There is no page at this address. Simon Brunou's homepage is at simonbrunou.bzh." />
        <meta name="robots" content="noindex, follow" />
        <meta name="theme-color" content="#e6e7e3" />
        <meta name="color-scheme" content="light" />
        <link rel="preload" href="/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/besley-latin.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="not-found">
        <main class="nf">
            <div class="wrap">
                <a class="nf-home" href="/">Simon Brunou</a>
                <div class="name-row nf-row">
                    <h1 class="display nf-title" id="nf-title">Page not found</h1>
                    <span class="year">404</span>
                </div>
                <p class="nf-text" id="nf-text">There is no page at this address.</p>
                <p class="actions">
                    <a class="btn btn-solid" href="/" id="nf-home-btn">Go to the homepage</a>
                    <a class="btn btn-line" href="/simon-brunou-cv.pdf" download id="nf-cv">Download the CV (PDF, in French)</a>
                </p>
            </div>
        </main>
        <footer class="contact nf-contact">
            <div class="wrap">
                <!--email_off--><a class="contact-mail" href="mailto:simon.brunou@proton.me">simon.brunou@proton.me</a><!--/email_off-->
                <p class="colophon" id="nf-colophon">© 2026 Simon Brunou. Saint-Nolff, Brittany.</p>
            </div>
        </footer>

        <script>
            // Same rule as visitorLang() in /profile.js. Kept inline because a
            // module would wait for a fetch, and a French Visitor would see the
            // English page first.
            (function () {
                var lang = "en";
                try {
                    var fromUrl = new URLSearchParams(window.location.search).get("lang");
                    if (fromUrl === "en" || fromUrl === "fr") lang = fromUrl;
                    else if (localStorage.getItem("lang") === "fr") lang = "fr";
                } catch (_) {}
                if (lang !== "fr") return;
                document.documentElement.lang = "fr";
                document.title = "Page introuvable, Simon Brunou";
                var text = {
                    "nf-title": "Page introuvable",
                    "nf-text": "Il n'y a pas de page à cette adresse.",
                    "nf-home-btn": "Aller à l'accueil",
                    "nf-cv": "Télécharger le CV (PDF)",
                    "nf-colophon": "© 2026 Simon Brunou. Saint-Nolff, Bretagne.",
                };
                Object.keys(text).forEach(function (id) {
                    document.getElementById(id).textContent = text[id];
                });
            })();
        </script>
    </body>
</html>
