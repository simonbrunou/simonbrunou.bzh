<!DOCTYPE html>
<!--
    Build-time template: rendered to simon-brunou-cv.pdf by
    `npm run build:pdf` (scripts/build-pdf.js). Not served in production.
    Two fixed A4 pages; strips bleed to the page edges (@page margin 0).
-->
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>CV Simon Brunou</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="page">
            <header class="head">
                <div class="head-row">
                    <img class="photo" src="/photo.png" alt="Simon Brunou" width="76" height="76" />
                    <div class="head-text">
                        <h1>Simon Brunou</h1>
                        <div class="role" id="resume-role"></div>
                        <div class="location" id="resume-location"></div>
                    </div>
                </div>
                <ul class="contact" id="resume-contact"></ul>
            </header>

            <section class="section">
                <h2>Profil</h2>
                <div id="resume-about"></div>
            </section>

            <section class="section">
                <h2>Projets</h2>
                <div id="resume-projects"></div>
            </section>

            <section class="section">
                <h2>Expérience</h2>
                <div id="resume-experience"></div>
            </section>
        </div>

        <div class="page">
            <div id="resume-experience-more"></div>

            <section class="section">
                <h2>Compétences</h2>
                <div id="resume-skills"></div>
            </section>

            <section class="section">
                <h2>Formation</h2>
                <div id="resume-education"></div>
            </section>

            <section class="section">
                <h2>Langues</h2>
                <ul class="lang-list" id="resume-languages"></ul>
            </section>

            <section class="section">
                <h2>Centres d'intérêt</h2>
                <p class="interests" id="resume-interests"></p>
            </section>
        </div>

        <script src="/data.js"></script>
        <script src="/render.js"></script>
        <script src="app.js"></script>
    </body>
</html>
