    <body>
        <!--
            THESIS: the products are the page. Each featured project fills a full-width band in its own app's colours, with screenshots bleeding off the edge; refuses the contained card grid of projects.
            OWN-WORLD: stone #E6E7E3 and ink #16181B. Diversif peach #FFDBBD and sage #6B8E6B, Cinder #0B0C10 and ember #F38042, BYSTAMP slate #2F5168. Big Shoulders Display caps over Besley text. Square 2px-border buttons, thick underlines, no cards.
            STORY: in 30 seconds the Visitor sees two shipped products and eight years at BYSTAMP, then emails Simon or downloads the CV.
            FIRST VIEWPORT: name in 96px caps at left with photo, role and place; intro and the two actions (Email me, Download the CV) at right; at 1440x900 the Diversif band's peach and sage fill the bottom half.
            FORM: Bands, prototype variant B, chosen over Rail, Document and Topo (ADR 0001). No seed key: the direction came from the prototype round.
            FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
        -->
