# Coolify builds production's image itself, and the push run on main scans the
# image of a commit whose PR run scanned it already. A new advisory against an
# unchanged image shows up only here: this workflow builds main's image every
# night and scans it with a fresh Trivy DB (AGENTS.md, "Trivy gate"). Start a
# scan on demand with
#   POST /api/v1/repos/simonbrunou/simonbrunou.bzh/actions/workflows/trivy.yml/dispatches {"ref": "main"}
# The checkout, the build and the three Trivy steps read the same as the test
# job's in ci.yml once parsed as YAML: test/trivy-workflows.test.js fails
# `npm test` when they differ.
name: Trivy

on:
  schedule:
    # 01:30 UTC is 02:30 in Paris in winter and 03:30 in summer, before the
    # host's backups, updates and CI runner prune (04:00 to 05:45 Paris).
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # The job drives the runner's own Docker daemon, which other jobs share:
      # the run id and attempt keep this image apart from ci.yml's and from an
      # earlier attempt's.
      IMAGE: simonbrunou-bzh:trivy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Every action is pinned by commit SHA, the tag in its comment, as the CI
      # runner's porting rules ask (homelab-stacks ct-125-ci-runner.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An attempt the runner lost never runs the cleanup step, so remove the
      # images earlier attempts of this run left, as the CI runner runbook's
      # "Docker resource names on the shared daemon" asks (copied from cinder's
      # "Remove earlier attempts' container and image"). The image goes by tag,
      # never by ID: ci.yml's run of the same tree builds the same image ID.
      # `--force` would skip a missing tag, but `image rm` still prints an error
      # for it, so the step checks first. `shell: bash` runs it with `-e`, so a
      # failed `docker` call fails the step, and `((...))` needs bash.
      # test/trivy-workflows.test.js runs this text against a stub docker.
      - name: Remove earlier attempts' images
        shell: bash
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$RUN_ATTEMPT" in
            '' | 0* | *[!0-9]*)
              echo "::error::github.run_attempt is '$RUN_ATTEMPT', not a positive integer, so the image names do not tell this run's attempts apart"
              exit 1
              ;;
          esac
          image_base=${IMAGE%-"$RUN_ATTEMPT"}
          if [ "$image_base" = "$IMAGE" ]; then
            echo "::error::IMAGE ($IMAGE) must end in -$RUN_ATTEMPT"
            exit 1
          fi
          if [ "$RUN_ATTEMPT" = 1 ]; then
            echo "This is attempt 1: no earlier attempt to clean up"
          fi
          for ((n = 1; n < RUN_ATTEMPT; n++)); do
            image="$image_base-$n"
            found=$(docker images --quiet "$image")
            if [ -n "$found" ]; then
              docker image rm --force "$image" >/dev/null
              state=removed
            else
              state=absent
            fi
            echo "Attempt $n: image $image $state"
          done
      - name: Build the production image
        run: docker build --tag "$IMAGE" .
      # trivy-action's own setup step checks out aquasecurity/trivy from github.com
      # with this forge's job token, which github.com rejects. Install the same
      # Trivy version directly and tell the action to skip its setup. The release
      # tarball is pinned by sha256 (from the release's trivy_0.70.0_checksums.txt)
      # rather than piping an install script from the network into a shell.
      - name: Install Trivy
        run: |
          set -eu
          cd "$(mktemp -d)"
          curl -sfL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
      # cinder#835: see the same step in ci.yml.
      - name: Download the Trivy vulnerability DB
        run: |
          for repo in ghcr.io/aquasecurity/trivy-db:2 mirror.gcr.io/aquasec/trivy-db:2; do
            if env -u GITHUB_TOKEN timeout --kill-after=10s 3m \
              trivy image --download-db-only --db-repository "$repo" \
              --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"; then
              exit 0
            else
              echo "::warning::Trivy DB download from $repo failed (exit $?)"
            fi
          done
          exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # The action fails when this file is missing and prints it under "Found ignorefile".
          trivyignores: .trivyignore
          exit-code: 1
      - name: Remove the scanned image
        if: always()
        run: docker image rm -f "$IMAGE" || true
