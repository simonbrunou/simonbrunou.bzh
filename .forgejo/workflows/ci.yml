name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The job drives the runner's own Docker daemon, which other jobs share:
      # names carry the run id so two runs never collide.
      IMAGE: simonbrunou-bzh:ci-${{ github.run_id }}
      CONTAINER: simonbrunou-bzh-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Before npm ci, so a Node pin that moved alone fails here, by name.
      - run: scripts/check-node-pins.sh
      - run: npm ci
      - run: npm test
      # The tests drive the app in-process; this checks the real entry point
      # boots and /healthz answers.
      - name: Boot server and probe /healthz
        run: |
          PORT=3999 node server.js &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3999/healthz && break
            sleep 0.5
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3999/healthz)
          kill "$pid" 2>/dev/null || true
          test "$code" = "200"
      # Coolify builds the Dockerfile on every deploy. Building and running the
      # image here makes a broken Dockerfile, or a served file missing from its
      # COPY lines, fail the PR instead of the deploy.
      - name: Build the production image
        run: docker build --tag "$IMAGE" .
      # Docker runs the Dockerfile HEALTHCHECK, the same wget of
      # 127.0.0.1:3000/healthz that Coolify's own check falls back to. The
      # run flags are the ones production uses (AGENTS.md, Deployment).
      - name: Run the image until Docker reports it healthy
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d --name "$CONTAINER" --cap-drop=ALL --init "$IMAGE"
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")
            test "$status" = healthy && exit 0
            test "$status" = unhealthy && break
            sleep 1
          done
          echo "container is $status" >&2
          docker logs "$CONTAINER" >&2
          exit 1
      # The expected files come from the checkout, so the check also sees a
      # served file the image lacks.
      - name: Check routes, files and permissions inside the image
        run: |
          site_files=$(node --input-type=module -e 'import { loadSiteFiles } from "./site.js"; console.log(JSON.stringify([...(await loadSiteFiles(".")).keys()]))')
          docker exec -i -e SITE_FILES="$site_files" "$CONTAINER" node --input-type=module - < scripts/check-image.js
      # Coolify stops the old container on every deploy. The init must pass
      # SIGTERM on and node must exit 0; a forced kill after the timeout
      # exits 137.
      - name: Stop the container and expect a clean exit
        run: |
          docker stop "$CONTAINER"
          code=$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER")
          echo "exit code: $code"
          test "$code" = 0
      - name: Remove the container and image
        if: always()
        run: |
          docker rm -f "$CONTAINER" || true
          docker image rm -f "$IMAGE" || true
